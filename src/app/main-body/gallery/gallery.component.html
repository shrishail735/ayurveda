
<div class="text-center mb-4" id="gallery">
  <p class="font-semibold text-3xl opacity-75 mb-5 md:text-4xl uppercase">Gallery</p>
  <div *ngIf="images.length; else noImages" class="flex justify-center gap-4 p-3 flex-wrap bg-[#739072]">
    <div class="" *ngFor="let image of images">
      <img
        class="h-[300px] w-[300px] box"
        [src]=image
        alt="Gallery Image"
      />
    </div>
  </div>
  <ng-template #noImages>
    <p>No images found.</p>
  </ng-template>
</div>
